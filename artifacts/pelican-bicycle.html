<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root { --ink:#22313f; --accent:#f2a33a; --sky:#bfe7ff; --road:#5b6470; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    display:grid; place-items:center; min-height:100vh; overflow:hidden;
    background:#e9f7ff; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .stage { width:min(96vw, 1000px); aspect-ratio: 900/520; filter: drop-shadow(0 18px 30px rgba(34,49,63,.18)); }
  svg { width:100%; height:100%; display:block; border-radius:22px; background:var(--sky); }
  .cloud { animation: drift 18s linear infinite; }
  .cloud.slow { animation-duration: 28s; animation-delay:-12s; }
  .cloud.fast { animation-duration: 14s; animation-delay:-5s; }
  .road-dash { stroke-dasharray: 26 22; animation: dash 1.1s linear infinite; }
  .wheel { transform-box:fill-box; transform-origin:center; animation: spin 1.15s linear infinite; }
  .crank { transform-box:fill-box; transform-origin:center; animation: spin 1.15s linear infinite; }
  .bob { transform-box:fill-box; transform-origin:center; animation: bob .62s ease-in-out infinite alternate; }
  .wing { transform-box:fill-box; transform-origin: 30% 60%; animation: wing .62s ease-in-out infinite alternate; }
  .head { transform-box:fill-box; transform-origin: 40% 80%; animation: headBob .62s ease-in-out infinite alternate; }
  .leg-near { transform-box:fill-box; transform-origin: top center; animation: pedal 1.15s ease-in-out infinite alternate; }
  .leg-far  { transform-box:fill-box; transform-origin: top center; animation: pedal 1.15s ease-in-out infinite alternate-reverse; }
  .scarf { transform-box:fill-box; transform-origin: left center; animation: flap .5s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { from { transform: translateY(0) } to { transform: translateY(7px) } }
  @keyframes headBob { from { transform: rotate(-2deg) } to { transform: rotate(3deg) } }
  @keyframes wing { from { transform: rotate(-7deg) } to { transform: rotate(8deg) } }
  @keyframes pedal { from { transform: rotate(-10deg) } to { transform: rotate(16deg) } }
  @keyframes dash { to { stroke-dashoffset: -48; } }
  @keyframes drift { from { transform: translateX(-180px) } to { transform: translateX(980px) } }
  @keyframes flap { from { transform: rotate(3deg) } to { transform: rotate(-9deg) } }
  @media (prefers-reduced-motion: reduce) {
    .cloud,.road-dash,.wheel,.crank,.bob,.wing,.head,.leg-near,.leg-far,.scarf { animation:none; }
  }
</style>
</head>
<body>
<div class="stage" role="img" aria-label="一只鹈鹕骑着自行车在乡间小路上前进的循环动画">
<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9edcff"/><stop offset=".62" stop-color="#d7f2ff"/><stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3a1"/><stop offset="1" stop-color="#5eac7b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8791"/><stop offset="1" stop-color="#4f5964"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f3f0e8"/><stop offset="1" stop-color="#d9d5c9"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcb63"/><stop offset="1" stop-color="#f08a2c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky + sun + hills -->
  <rect width="900" height="520" fill="url(#sky)"/>
  <circle cx="770" cy="96" r="46" fill="#ffd86b" opacity=".95"/>
  <circle cx="770" cy="96" r="62" fill="#ffd86b" opacity=".18" filter="url(#soft)"/>
  <g class="cloud" opacity=".85">
    <ellipse cx="130" cy="112" rx="54" ry="24" fill="#fff"/><ellipse cx="165" cy="100" rx="36" ry="30" fill="#fff"/><ellipse cx="96" cy="104" rx="28" ry="20" fill="#fff"/>
  </g>
  <g class="cloud slow" opacity=".6">
    <ellipse cx="470" cy="76" rx="46" ry="18" fill="#fff"/><ellipse cx="500" cy="66" rx="26" ry="22" fill="#fff"/>
  </g>
  <g class="cloud fast" opacity=".5">
    <ellipse cx="660" cy="150" rx="38" ry="14" fill="#fff"/><ellipse cx="686" cy="142" rx="22" ry="18" fill="#fff"/>
  </g>
  <path d="M0 330 Q145 240 300 312 T610 300 T900 270 V520 H0Z" fill="url(#hill)" opacity=".92"/>
  <path d="M0 376 Q170 300 340 360 T650 340 T900 320 V520 H0Z" fill="#4d956d" opacity=".8"/>
  <g opacity=".55" fill="#2f6b4e">
    <circle cx="150" cy="312" r="18"/><rect x="147" y="312" width="6" height="44" rx="3"/>
    <circle cx="700" cy="320" r="22"/><rect x="697" y="320" width="6" height="52" rx="3"/>
  </g>

  <!-- road -->
  <rect y="408" width="900" height="112" fill="url(#road)"/>
  <rect y="404" width="900" height="10" fill="#9aa4ad"/>
  <path d="M0 470 H900" stroke="#f4f0e6" stroke-width="8" class="road-dash" opacity=".85"/>
  <path d="M0 500 H900" stroke="#f4f0e6" stroke-width="3" opacity=".18"/>

  <!-- bicycle + pelican -->
  <g transform="translate(0 0)">
    <!-- shadow -->
    <ellipse cx="445" cy="452" rx="220" ry="18" fill="#26313b" opacity=".22"/>

    <!-- wheels -->
    <g>
      <g class="wheel">
        <circle cx="300" cy="392" r="64" fill="none" stroke="#1e2b35" stroke-width="8"/>
        <circle cx="300" cy="392" r="56" fill="none" stroke="#c9d1d7" stroke-width="2" stroke-dasharray="4 10"/>
        <path d="M300 330 V454 M238 392 H362 M256 348 L344 436 M344 348 L256 436" stroke="#b9c3cb" stroke-width="3"/>
        <circle cx="300" cy="392" r="7" fill="#f2a33a" stroke="#1e2b35" stroke-width="3"/>
      </g>
      <g class="wheel">
        <circle cx="600" cy="392" r="64" fill="none" stroke="#1e2b35" stroke-width="8"/>
        <circle cx="600" cy="392" r="56" fill="none" stroke="#c9d1d7" stroke-width="2" stroke-dasharray="4 10"/>
        <path d="M600 330 V454 M538 392 H662 M556 348 L644 436 M644 348 L556 436" stroke="#b9c3cb" stroke-width="3"/>
        <circle cx="600" cy="392" r="7" fill="#f2a33a" stroke="#1e2b35" stroke-width="3"/>
      </g>
    </g>

    <!-- frame -->
    <g fill="none" stroke="#263640" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300 392 L390 300 L520 300 L600 392" stroke-width="9"/>
      <path d="M390 300 L440 392" stroke-width="9"/>
      <path d="M440 392 L520 300" stroke-width="9"/>
      <path d="M390 300 L360 260" stroke-width="8"/>
      <path d="M560 300 L585 250" stroke-width="8"/>
      <path d="M300 392 L390 300" stroke-width="9"/>
    </g>
    <path d="M550 248 Q600 230 640 252" fill="none" stroke="#263640" stroke-width="9" stroke-linecap="round"/>
    <circle cx="642" cy="252" r="9" fill="#f2a33a" stroke="#263640" stroke-width="4"/>
    <!-- seat -->
    <path d="M350 260 Q390 244 420 260 Q390 272 350 260Z" fill="#263640"/>

    <!-- pedals + crank -->
    <circle cx="440" cy="392" r="10" fill="#f2a33a" stroke="#263640" stroke-width="4"/>
    <g class="crank">
      <path d="M440 392 L478 370" stroke="#263640" stroke-width="7" stroke-linecap="round"/>
      <path d="M440 392 L402 414" stroke="#263640" stroke-width="7" stroke-linecap="round"/>
      <rect x="472" y="362" width="24" height="10" rx="4" fill="#263640" transform="rotate(-12 484 367)"/>
      <rect x="390" y="408" width="24" height="10" rx="4" fill="#263640" transform="rotate(-12 402 413)"/>
    </g>

    <!-- pelican body -->
    <g class="bob">
      <ellipse cx="486" cy="270" rx="98" ry="72" fill="url(#body)" stroke="#c9c2b3" stroke-width="2"/>
      <path d="M560 242 Q604 262 620 306 Q592 326 548 306" fill="#e8e3d7" stroke="#c9c2b3" stroke-width="2"/>
      <!-- tail -->
      <path d="M390 270 L336 238 Q330 272 352 292 Z" fill="#e6e0d3" stroke="#c9c2b3" stroke-width="2"/>
      <!-- wing -->
      <g class="wing">
        <path d="M472 222 Q540 206 578 252 Q546 296 486 292 Q456 264 472 222Z" fill="#ece7db" stroke="#bdb6a7" stroke-width="2"/>
        <path d="M500 246 Q542 248 560 270 M492 268 Q528 270 546 286" fill="none" stroke="#c7c0b2" stroke-width="2"/>
      </g>
      <!-- neck + head -->
      <g class="head">
        <path d="M540 228 Q558 168 516 132 Q490 112 470 138 Q454 168 474 198 Q486 220 512 234" fill="url(#body)" stroke="#c9c2b3" stroke-width="2"/>
        <circle cx="486" cy="138" r="40" fill="url(#body)" stroke="#c9c2b3" stroke-width="2"/>
        <circle cx="500" cy="130" r="7" fill="#22313f"/>
        <circle cx="502" cy="128" r="2.5" fill="#fff"/>
        <!-- beak -->
        <path d="M512 142 Q592 138 640 164 Q598 188 520 170 Q504 162 512 142Z" fill="url(#beak)" stroke="#c96f1c" stroke-width="2"/>
        <path d="M520 154 Q586 158 620 166" fill="none" stroke="#d67b1e" stroke-width="2"/>
        <path d="M586 168 Q598 192 574 204 Q558 190 552 176" fill="#f6b34d" stroke="#c96f1c" stroke-width="2"/>
        <!-- scarf -->
        <path d="M508 190 Q480 206 438 198 L428 218 Q470 228 514 208Z" fill="#e75858"/>
        <path d="M438 198 Q414 212 394 208 L388 226 Q416 236 448 218Z" fill="#e75858" class="scarf"/>
      </g>
      <!-- legs -->
      <g class="leg-near" stroke="#c96f1c" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M500 318 Q510 350 478 370"/>
        <path d="M478 370 L500 388"/>
      </g>
      <g class="leg-far" stroke="#d98b3e" stroke-width="8" stroke-linecap="round" fill="none" opacity=".8">
        <path d="M470 318 Q460 350 402 414"/>
        <path d="M402 414 L426 428"/>
      </g>
    </g>
  </g>

  <!-- foreground grass -->
  <path d="M0 520 V492 Q94 462 188 500 Q278 532 366 496 Q462 456 552 500 Q642 540 744 500 Q828 468 900 494 V520Z" fill="#2f6b4e" opacity=".9"/>
  <g stroke="#3f835f" stroke-width="4" stroke-linecap="round" opacity=".9">
    <path d="M88 514 Q84 484 70 470"/><path d="M102 516 Q106 486 122 470"/>
    <path d="M770 512 Q766 482 752 466"/><path d="M786 516 Q792 486 806 470"/>
  </g>
</svg>
</div>
</body>
</html>
