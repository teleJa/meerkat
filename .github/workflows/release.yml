name: Release Meerkat
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify release artifacts only
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: meerkat-release-${{ github.event_name == 'push' && 'publish' || github.run_id }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
jobs:
  android:
    if: github.repository == 'teleJa/meerkat' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node scripts/ci/release.mjs source
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: desktop/MeerkatDesktop/go.mod
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build native Android library
        working-directory: desktop/MeerkatDesktop
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0' 'ndk;26.3.11579264'
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          wails3 android overlay:gen -out build/android/overlay.json -config build/config.yml
          bin="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$bin/aarch64-linux-android21-clang" CXX="$bin/aarch64-linux-android21-clang++"
          key=$(tr -d '[:space:]' < ../../scripts/release-public-key.txt)
          lib=build/android/app/src/main/jniLibs/arm64-v8a/libwails.so
          mkdir -p "$(dirname "$lib")"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 go build -buildmode=c-shared -overlay build/android/overlay.json -tags android -buildvcs=false -ldflags="-s -w -X main.androidUpdateKey=$key" -o "$lib" .
      - name: Sign Android release
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          ANDROID_KEYSTORE_FILE=$(mktemp "$RUNNER_TEMP/meerkat.XXXXXXXX.p12")
          export ANDROID_KEYSTORE_FILE
          trap 'rm -f -- "$ANDROID_KEYSTORE_FILE"' EXIT
          printf %s "$KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          unset KEYSTORE
          project=desktop/MeerkatDesktop/build/android
          "$project/gradlew" -p "$project" assembleRelease --no-daemon --console=plain
          mkdir -p out
          cp "$project/app/build/outputs/apk/release/app-release.apk" "out/Meerkat-Android-$(<VERSION).apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error
          overwrite: true
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node scripts/ci/release.mjs source
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: edge/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.9.0'
      - name: Build desktop and Edge
        run: |
          npm install -g pnpm@10.28.2
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec vite build
          desktop=desktop/MeerkatDesktop
          mkdir -p "$desktop/frontend/dist" "$desktop/bin/Meerkat-Windows"
          cp web/dist/index.html "$desktop/frontend/dist/"
          version=$(tr -d '[:space:]' < VERSION)
          key=$(tr -d '[:space:]' < scripts/release-public-key.txt)
          export CGO_ENABLED=0 GOARCH=amd64 GOOS=windows
          (cd "$desktop" && go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.appVersion=$version -X main.updatePublicKey=$key" -o bin/Meerkat-Windows/Meerkat.exe .)
          (cd edge && go build -o "../$desktop/bin/Meerkat-Windows/meerkat-edge.exe" ./cmd/meerkat-edge)
      - name: Package installer and portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          choco install nsis --version=3.08 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location desktop/MeerkatDesktop/build/windows
          & "${env:ProgramFiles(x86)}/NSIS/makensis.exe" "/DAPP_VERSION=$version" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location desktop/MeerkatDesktop/bin
          python -m zipfile -c "Meerkat-Windows-v$version.zip" Meerkat-Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            desktop/MeerkatDesktop/bin/Meerkat-Setup-*.exe
            desktop/MeerkatDesktop/bin/Meerkat-Windows-v*.zip
          if-no-files-found: error
          overwrite: true
  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          node scripts/ci/release.mjs source
          if [[ $GITHUB_EVENT_NAME == push ]]; then node scripts/release-update.mjs verify-release "$(<VERSION)"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{android,windows}'
          merge-multiple: true
          path: ${{ runner.temp }}/meerkat-release
      - name: Inspect packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          python3 scripts/ci/check-packages.py "$RUNNER_TEMP/meerkat-release"
      - name: Sign update manifest
        env:
          RELEASE_KEY: ${{ secrets.MEERKAT_RELEASE_KEY_B64 }}
        run: |
          umask 077
          MEERKAT_RELEASE_SIGNING_KEY_FILE=$(mktemp "$RUNNER_TEMP/meerkat.XXXXXXXX.pem")
          export MEERKAT_RELEASE_SIGNING_KEY_FILE
          trap 'rm -f -- "$MEERKAT_RELEASE_SIGNING_KEY_FILE"' EXIT
          printf %s "$RELEASE_KEY" | base64 -d > "$MEERKAT_RELEASE_SIGNING_KEY_FILE"
          unset RELEASE_KEY
          version=$(<VERSION)
          export MEERKAT_ANDROID_APK="$RUNNER_TEMP/meerkat-release/Meerkat-Android-$version.apk" ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          node scripts/release-update.mjs manifest "$version" "$RUNNER_TEMP/meerkat-release/Meerkat-Setup-$version.exe"
      - run: node scripts/ci/release.mjs verify "$RUNNER_TEMP/meerkat-release"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: ${{ runner.temp }}/meerkat-release/*
          if-no-files-found: error
          overwrite: true
      - name: Publish verified draft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(<VERSION)
          node scripts/release-update.mjs publish "$version" "$RUNNER_TEMP/meerkat-release/Meerkat-Setup-$version.exe" --verified-assets
